name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      - run: python -m py_compile arr-webhook.py abandoned_audit.py arr_health.py deluge_trim.py monthly_upgrade.py media_share.py watch_hold.py
      - run: ruff check arr-webhook.py abandoned_audit.py arr_health.py deluge_trim.py monthly_upgrade.py media_share.py watch_hold.py
      - run: python test_dockerfile_copies.py   # every imported local module is COPYed into the image

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash backup/tests/test_plex_db_r2.sh
      - run: bash tests/update_sh_test.sh

      - name: CI auto-retry tests
        run: python3 -I tests/test-ci-infra-retry.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: plex-automation:ci

  # AltMount rebuilt against the fixed nntppool (altmount/Dockerfile). The build runs the fix's regression test and
  # AltMount's usenet tests, and checks the linked nntppool version.
  altmount-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: altmount
          push: false
          load: true
          tags: altmount-nntppool-fix:ci
      - name: Image carries the rebuilt binary and the upstream web UI
        run: |
          docker inspect -f '{{index .Config.Labels "altmount.nntppool.commit"}}' altmount-nntppool-fix:ci \
            | grep -qx 292745291188a4a1afd497837356b97e24dfe54b
          docker run --rm --entrypoint sh altmount-nntppool-fix:ci -c \
            'test -x /app/altmount && test -s /app/frontend/dist/index.html && ls -l /app/altmount'
