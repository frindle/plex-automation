name: tiering-e2e

on:
  workflow_dispatch:
  pull_request:
    paths: ["tiering/**", "tierfs/**", ".github/workflows/tiering-e2e.yml"]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install FUSE, ffmpeg, bindfs
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 ffmpeg bindfs
      - name: Syntax checks
        run: |
          python3 -m py_compile tiering/e2e/plexctl.py tiering/e2e/fake_webdav.py
          for f in tiering/e2e/*.sh; do bash -n "$f"; done
      - name: Media is deterministic
        run: |
          a=$(mktemp -d); b=$(mktemp -d)
          MEDIA_SECONDS=2 tiering/e2e/make_media.sh "$a" --movies-only >/dev/null
          MEDIA_SECONDS=2 tiering/e2e/make_media.sh "$b" --movies-only >/dev/null
          diff "$a/SHA256SUMS" "$b/SHA256SUMS"
      - name: Mount propagation smoke test
        run: tiering/e2e/test_mount_propagation.sh
      - name: Plex API, plex_watch and hotset against a live Plex
        run: tiering/e2e/test_plex_api.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: tierfs/go.mod
          cache-dependency-path: tierfs/go.sum
      - name: Build tierfs and the test tools
        run: |
          (cd tierfs && go build -o "$RUNNER_TEMP/tierfs" ./cmd/tierfs)
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install pytest pytest-xdist blake3
      - name: Offload tier, real runner, emulated mount
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest --confcutdir=tiering/e2e \
            tiering/e2e/test_tier_*.py -q -n 4 -rxXfE --tb=short
      - name: Offload tier, real runner, real tierfs mount (root, FUSE)
        run: |
          sudo env E2E_TIERFS_BIN="$RUNNER_TEMP/tierfs" \
            "$RUNNER_TEMP/venv/bin/python" -m pytest --confcutdir=tiering/e2e \
            tiering/e2e/test_tier_*.py -q -n 4 -rxXfE --tb=short
      - name: Real Plex through the real tierfs mount (root, FUSE, docker)
        run: |
          sudo env E2E_TIERFS_BIN="$RUNNER_TEMP/tierfs" E2E_PLEX=1 \
            "$RUNNER_TEMP/venv/bin/python" -m pytest --confcutdir=tiering/e2e \
            tiering/e2e/test_plex_tierfs.py -q -rxXfEs --tb=short
      - name: Plex log on failure
        if: failure()
        run: |
          docker logs --tail 100 tiering-e2e-plex 2>&1 || true
