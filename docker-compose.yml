services:
  arr-webhook:
    build: .
    container_name: arr-webhook
    restart: unless-stopped
    entrypoint: ["python", "-u", "arr-webhook.py"]
    environment:
      DELUGE_URL: "http://10.0.0.2:8112"
      DELUGE_PASSWORD: ${DELUGE_PASSWORD}
      SONARR_URL: "http://10.0.0.8:8989"
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_URL: "http://10.0.0.7:7878"
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_UPGRADE_LABEL: "sonarr-upgrade"
      RADARR_UPGRADE_LABEL: "radarr-upgrade"
      PORT: "9876"
      SEEDING_DIR: "/data/Downloads/Just4Seeding"
      # Errored-torrent repair: rechecks are automatic, relocations are only
      # reported. Flip to "1" to let it move_storage too -- note that
      # library-seeding torrents seed the media files themselves, so a relink
      # can move real library data.
      DELUGE_RELINK: "0"
      SEED_DAYS: "21"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      UPLOAD_RATE_LIMIT_MBIT: "5"
      PLEX_URL: "http://10.0.0.6:32400"
      PLEX_TOKEN: ${PLEX_TOKEN}
    mac_address: "02:8e:b2:5d:a1:37"
    networks:
      br0:
        ipv4_address: 10.0.0.4
    volumes:
      - ./data:/data
      # Deluge's download tree, mounted at the SAME path Deluge itself uses so
      # DELUGE_PATH_MAP's entry for it is a no-op identity mapping.
      # Needed by /run-deluge-repair's missing-data search and by
      # /incomplete-orphans (which fails "not a directory" without it).
      - "/mnt/user/data/Downloads:/data/Downloads"
      - "/mnt/user/data/Media/Movies:/media/movies"
      # rw (not ro) so /plex-dupe-fix can delete misplaced episode files
      # via the filesystem fallback when the Plex API rejects the delete.
      - "/mnt/user/data/Media/TV Shows:/media/tv"
      - "/mnt/user/data/Media/Music:/media/music:ro"

networks:
  br0:
    external: true
