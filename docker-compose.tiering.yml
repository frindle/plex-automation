# Offload tier: tierfs (the FUSE mount offloaded files are read through) and the
# offload runner. See tiering/README.md, "Deploy with compose".
#
# This file is NOT loaded by default. To turn the tier on, add to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tiering.yml
# update.sh then builds and starts these two with the rest. Remove the line to
# leave them alone again (stop them first: docker-compose stop tiering-runner tierfs).
#
# Every site value comes from .env (see .env.example); nothing here is a secret.
# ${TIERFS_MOUNT} must be the SAME absolute path on the host, in both containers
# here, in Plex and in the arrs: library symlinks point at it.

services:
  tierfs:
    build: ./tierfs
    container_name: tierfs
    restart: unless-stopped
    # The reader class (player or background scan) is read from /proc/<pid>/comm
    # of the reading process, so tierfs must see host pids.
    pid: host
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      TIERFS_MOUNT: "${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}"
      TIERFS_MANIFESTS: "/state/manifests"
      TIERFS_STUB_ROOTS: "${TIERFS_STUB_ROOTS:?set TIERFS_STUB_ROOTS in .env}"
      TIERFS_EVENTS: "/state/events/events.jsonl"
      TIERFS_REMOTE_BASE: "${TIERFS_REMOTE_BASE:?set TIERFS_REMOTE_BASE in .env}"
      TIERFS_REMOTE_USER: "${TIERFS_REMOTE_USER:-}"
      TIERFS_REMOTE_PASS: "${TIERFS_REMOTE_PASS:-}"
      # Seconds a player read waits for the promote before it gets an error.
      TIERFS_WAIT_S: "${TIERFS_WAIT_S:-900}"
      # Readers that stream from the remote and never trigger a promote.
      TIERFS_BACKGROUND_COMMS: "${TIERFS_BACKGROUND_COMMS:-Plex Media Scan}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9109/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      br0:
        ipv4_address: "${TIERFS_IP:?set TIERFS_IP in .env}"
    volumes:
      # Stubs live on the array disks; tierfs reads them at the paths the runner
      # wrote into the manifests, so both see the host's /mnt unchanged. Read-only.
      - "/mnt:/mnt:ro,rslave"
      # The FUSE mount itself, shared back to the host so Plex and the arrs get it.
      # The host directory must already be a shared mount point
      # (tiering/tierfs-host-mount.sh does that at array start).
      - "${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}:${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}:rshared"
      - "${TIERING_STATE_DIR:?set TIERING_STATE_DIR in .env}/manifests:/state/manifests:ro"
      - "${TIERING_STATE_DIR:?set TIERING_STATE_DIR in .env}/events:/state/events"

  tiering-runner:
    build: ./tiering
    container_name: tiering-runner
    restart: unless-stopped
    depends_on:
      tierfs:
        condition: service_healthy
    # Plex reads through the user share, so only the share daemon's open file shows
    # that a file is in use: the runner must see host pids and read their fd lists.
    pid: host
    cap_add:
      - SYS_PTRACE
    environment:
      TZ: "${TIERING_TZ:?set TIERING_TZ in .env}"   # the demote window is local time
      TIERING_DB: "/state/tiering.db"
      # "0" plans and logs only. Set "1" in .env after reading a dry run.
      TIERING_APPLY: "${TIERING_APPLY:-0}"
      TIERING_DEMOTE_WINDOW: "${TIERING_DEMOTE_WINDOW:-02:00-06:00}"
      TIERING_DEMOTE_GB_PER_NIGHT: "${TIERING_DEMOTE_GB_PER_NIGHT:-200}"
      TIERING_IDLE_DAYS: "${TIERING_IDLE_DAYS:-60}"
      TIERING_NEW_DAYS: "${TIERING_NEW_DAYS:-30}"
      TIERING_NEAR_END_EPS: "${TIERING_NEAR_END_EPS:-3}"
      TIERING_NEVER_SECTIONS: "${TIERING_NEVER_SECTIONS:-Adult}"
      # Every name must be visible from the container or nothing is demoted.
      TIERING_PROC_CANARY: "${TIERING_PROC_CANARY:-Plex Media Serv,shfs}"
      TIERING_PATH_MAP: "${TIERING_PATH_MAP:?set TIERING_PATH_MAP in .env}"
      TIERING_ARR_PATH_MAP: "${TIERING_ARR_PATH_MAP:-}"
      TIERING_GATE_PATH_MAP: "${TIERING_GATE_PATH_MAP:?set TIERING_GATE_PATH_MAP in .env}"
      # The torrent gate served by arr-webhook.
      TIERING_API: "${TIERING_API:?set TIERING_API in .env}"
      TIERING_NZB_DIR: "/state/nzb"
      TIERFS_MOUNT: "${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}"
      TIERFS_MANIFESTS: "/state/manifests"
      TIERFS_EVENTS: "/state/events/events.jsonl"
      TIERFS_STUB_ROOTS: "${TIERFS_STUB_ROOTS:?set TIERFS_STUB_ROOTS in .env}"
      TIERFS_REMOTE_BASE: "${TIERFS_REMOTE_BASE:?set TIERFS_REMOTE_BASE in .env}"
      TIERFS_REMOTE_USER: "${TIERFS_REMOTE_USER:-}"
      TIERFS_REMOTE_PASS: "${TIERFS_REMOTE_PASS:-}"
      PLEX_URL: "${TIERING_PLEX_URL:?set TIERING_PLEX_URL in .env}"
      PLEX_TOKEN: "${PLEX_TOKEN}"
      SONARR_URL: "${TIERING_SONARR_URL:?set TIERING_SONARR_URL in .env}"
      SONARR_API_KEY: "${SONARR_API_KEY}"
      RADARR_URL: "${TIERING_RADARR_URL:?set TIERING_RADARR_URL in .env}"
      RADARR_API_KEY: "${RADARR_API_KEY}"
      # Plain http to the arrs and the import API is refused unless allowed.
      TIERING_ARR_ALLOW_HTTP: "${TIERING_ARR_ALLOW_HTTP:-0}"
      TIERING_ALTMOUNT_ALLOW_HTTP: "${TIERING_ALTMOUNT_ALLOW_HTTP:-0}"
      ALTMOUNT_URL: "${ALTMOUNT_URL:-}"
      ALTMOUNT_API_KEY: "${ALTMOUNT_API_KEY:-}"
      ALTMOUNT_MOUNT_PATH: "${ALTMOUNT_MOUNT_PATH:-}"
      ALTMOUNT_CATEGORY: "${ALTMOUNT_CATEGORY:-}"
      # JSON list: [{"name": "...", "url": "...", "apikey": "..."}]
      NEWZNAB_INDEXERS: "${NEWZNAB_INDEXERS:-}"
      NNTP_PRIMARY_HOST: "${NNTP_PRIMARY_HOST:-}"
      NNTP_PRIMARY_PORT: "${NNTP_PRIMARY_PORT:-563}"
      NNTP_PRIMARY_USER: "${NNTP_PRIMARY_USER:-}"
      NNTP_PRIMARY_PASS: "${NNTP_PRIMARY_PASS:-}"
      NNTP_SECONDARY_HOST: "${NNTP_SECONDARY_HOST:-}"
      NNTP_SECONDARY_PORT: "${NNTP_SECONDARY_PORT:-563}"
      NNTP_SECONDARY_USER: "${NNTP_SECONDARY_USER:-}"
      NNTP_SECONDARY_PASS: "${NNTP_SECONDARY_PASS:-}"
    networks:
      br0:
        ipv4_address: "${TIERING_RUNNER_IP:?set TIERING_RUNNER_IP in .env}"
    volumes:
      # The host's /mnt unchanged: every /mnt/diskN (file operations run on the disk
      # paths, never through the share) and the tierfs mount as it comes and goes.
      - "/mnt:/mnt:rslave"
      # The share at the path Plex reports for it, read-only.
      - "${TIERING_SHARE_HOST:?set TIERING_SHARE_HOST in .env}:${TIERING_SHARE_PLEX:?set TIERING_SHARE_PLEX in .env}:ro,rslave"
      - "${TIERING_STATE_DIR:?set TIERING_STATE_DIR in .env}:/state"

  # The webhook container reads library files too (audits, duplicate cleanup), so
  # it needs the mount at the same path to follow the symlinks.
  arr-webhook:
    volumes:
      - "${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}:${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}:ro,rslave"
