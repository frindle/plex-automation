# Offload tier: one `tiering` container runs tierfs (the FUSE mount offloaded
# files are read through) and the offload runner. See tiering/README.md,
# "Deploy with compose". tiering/offload/supervise.py starts tierfs first,
# restarts the runner on its own if it exits (the mount stays up), and stops
# tierfs last. To pause offloading and keep the mount, create
# ${TIERING_STATE_DIR}/runner.paused; delete it to resume.
#
# This file is NOT loaded by default. To turn the tier on, add to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tiering.yml
# update.sh then builds and starts it with the rest. Remove the line to leave it
# alone again (stop it first: docker-compose stop tiering).
#
# Every site value comes from .env (see .env.example); nothing here is a secret.
# ${TIERFS_MOUNT} must be the SAME absolute path on the host, in this container,
# in Plex and in the arrs: library symlinks point at it.

services:
  tiering:
    build:
      context: .
      dockerfile: tiering/Dockerfile
    container_name: tiering
    restart: unless-stopped
    # tierfs reads the reader class (player or background scan) from
    # /proc/<pid>/comm of the reading process, and Plex reads through the user
    # share, so only the share daemon's open file shows that a file is in use:
    # both need host pids, and the runner reads their fd lists (SYS_PTRACE).
    pid: host
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    # The runner gets up to 60 s to finish, then tierfs up to 20 s to unmount.
    stop_grace_period: 90s
    environment:
      TZ: "${TIERING_TZ:?set TIERING_TZ in .env}"   # the demote window is local time
      TIERING_DB: "/state/tiering.db"
      # "0" plans and logs only. Set "1" in .env after reading a dry run.
      TIERING_APPLY: "${TIERING_APPLY:-0}"
      TIERING_DEMOTE_WINDOW: "${TIERING_DEMOTE_WINDOW:-02:00-06:00}"
      TIERING_DEMOTE_GB_PER_NIGHT: "${TIERING_DEMOTE_GB_PER_NIGHT:-200}"
      TIERING_IDLE_DAYS: "${TIERING_IDLE_DAYS:-60}"
      # Days a new import stays whole. 0: an unwatched import is offloaded like any
      # cold file (the stub keeps its head, so it still starts at once).
      TIERING_NEW_DAYS: "${TIERING_NEW_DAYS:-0}"
      TIERING_NEAR_END_EPS: "${TIERING_NEAR_END_EPS:-3}"
      TIERING_NEVER_SECTIONS: "${TIERING_NEVER_SECTIONS:-Adult}"
      TIERING_KEEP_4K: "${TIERING_KEEP_4K:-0}"
      TIERING_MAX_STREAM_KBPS: "${TIERING_MAX_STREAM_KBPS:-0}"
      # Optional demote allowlist for a first live test (tiering/README.md). Empty = no
      # restriction. A list file must be a container path, e.g. @/state/only-paths.txt.
      TIERING_ONLY_PATHS: "${TIERING_ONLY_PATHS:-}"
      # Promote: seconds a failing chunk fetch is retried, and promotes run at once.
      TIERING_PROMOTE_RETRY_S: "${TIERING_PROMOTE_RETRY_S:-600}"
      TIERING_PROMOTE_CONCURRENCY: "${TIERING_PROMOTE_CONCURRENCY:-2}"
      # the nightly integrity check and the automatic re-download of a lost file (off until set to 1)
      TIERING_AUTO_REDOWNLOAD: "${TIERING_AUTO_REDOWNLOAD:-0}"
      TIERING_CHECK_EVERY_H: "${TIERING_CHECK_EVERY_H:-24}"
      TIERING_CHECK_MAX_H: "${TIERING_CHECK_MAX_H:-4}"
      TIERING_REDOWNLOAD_MAX_PER_NIGHT: "${TIERING_REDOWNLOAD_MAX_PER_NIGHT:-3}"
      # Days an orphaned stub (arr upgrade replaced L) is kept before cleanup; 0 = off.
      TIERING_ORPHAN_GRACE_DAYS: "${TIERING_ORPHAN_GRACE_DAYS:-7}"
      # Every name must be visible from the container or nothing is demoted.
      TIERING_PROC_CANARY: "${TIERING_PROC_CANARY:-Plex Media Serv,shfs}"
      TIERING_PATH_MAP: "${TIERING_PATH_MAP:?set TIERING_PATH_MAP in .env}"
      TIERING_ARR_PATH_MAP: "${TIERING_ARR_PATH_MAP:-}"
      TIERING_GATE_PATH_MAP: "${TIERING_GATE_PATH_MAP:?set TIERING_GATE_PATH_MAP in .env}"
      # The torrent gate served by arr-webhook.
      TIERING_API: "${TIERING_API:?set TIERING_API in .env}"
      TIERING_NZB_DIR: "/state/nzb"
      # tierfs and the runner share these.
      TIERFS_MOUNT: "${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}"
      TIERFS_MANIFESTS: "/state/manifests"
      TIERFS_EVENTS: "/state/events/events.jsonl"
      TIERFS_STUB_ROOTS: "${TIERFS_STUB_ROOTS:?set TIERFS_STUB_ROOTS in .env}"
      TIERFS_REMOTE_BASE: "${TIERFS_REMOTE_BASE:?set TIERFS_REMOTE_BASE in .env}"
      TIERFS_REMOTE_USER: "${TIERFS_REMOTE_USER:-}"
      TIERFS_REMOTE_PASS: "${TIERFS_REMOTE_PASS:-}"
      # tierfs only: seconds a player read waits for the promote before it gets
      # an error, and readers that stream from the remote and never trigger one.
      TIERFS_WAIT_S: "${TIERFS_WAIT_S:-900}"
      TIERFS_BACKGROUND_COMMS: "${TIERFS_BACKGROUND_COMMS:-Plex Media Scan,watch-align}"
      PLEX_URL: "${TIERING_PLEX_URL:?set TIERING_PLEX_URL in .env}"
      PLEX_TOKEN: "${PLEX_TOKEN}"
      SONARR_URL: "${TIERING_SONARR_URL:?set TIERING_SONARR_URL in .env}"
      SONARR_API_KEY: "${SONARR_API_KEY}"
      RADARR_URL: "${TIERING_RADARR_URL:?set TIERING_RADARR_URL in .env}"
      RADARR_API_KEY: "${RADARR_API_KEY}"
      # Plain http to the arrs and the import API is refused unless allowed.
      TIERING_ARR_ALLOW_HTTP: "${TIERING_ARR_ALLOW_HTTP:-0}"
      TIERING_ALTMOUNT_ALLOW_HTTP: "${TIERING_ALTMOUNT_ALLOW_HTTP:-0}"
      ALTMOUNT_URL: "${ALTMOUNT_URL:-}"
      ALTMOUNT_API_KEY: "${ALTMOUNT_API_KEY:-}"
      ALTMOUNT_MOUNT_PATH: "${ALTMOUNT_MOUNT_PATH:-}"
      ALTMOUNT_CATEGORY: "${ALTMOUNT_CATEGORY:-}"
      # JSON list: [{"name": "...", "url": "...", "apikey": "..."}]
      NEWZNAB_INDEXERS: "${NEWZNAB_INDEXERS:-}"
      NNTP_PRIMARY_HOST: "${NNTP_PRIMARY_HOST:-}"
      NNTP_PRIMARY_PORT: "${NNTP_PRIMARY_PORT:-563}"
      NNTP_PRIMARY_USER: "${NNTP_PRIMARY_USER:-}"
      NNTP_PRIMARY_PASS: "${NNTP_PRIMARY_PASS:-}"
      NNTP_SECONDARY_HOST: "${NNTP_SECONDARY_HOST:-}"
      NNTP_SECONDARY_PORT: "${NNTP_SECONDARY_PORT:-563}"
      NNTP_SECONDARY_USER: "${NNTP_SECONDARY_USER:-}"
      NNTP_SECONDARY_PASS: "${NNTP_SECONDARY_PASS:-}"
      # 1 = run with the primary provider alone (no secondary set up): every STAT runs on it only.
      TIERING_SINGLE_PROVIDER: "${TIERING_SINGLE_PROVIDER:-0}"
    # Both /healthz endpoints (tierfs and the runner); a paused runner counts as healthy.
    healthcheck:
      test: ["CMD", "python", "-m", "offload.supervise", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # A fixed MAC, like the main service: on br0 Docker otherwise makes a new one on every restart,
    # and the router sees a new device each time.
    mac_address: "${TIERING_MAC:-02:8e:b2:5d:a1:38}"
    networks:
      br0:
        ipv4_address: "${TIERING_IP:?set TIERING_IP in .env}"
    volumes:
      # The host's /mnt unchanged: every /mnt/diskN (file operations run on the disk
      # paths, never through the share; tierfs reads the stubs there at the paths
      # in the manifests) and the tierfs mount as it comes and goes.
      - "/mnt:/mnt:rslave"
      # The FUSE mount itself, shared back to the host so Plex and the arrs get it.
      # The host directory must already be a shared mount point
      # (tiering/tierfs-host-mount.sh does that at array start).
      - "${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}:${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}:rshared"
      # The share at the path Plex reports for it, read-only.
      - "${TIERING_SHARE_HOST:?set TIERING_SHARE_HOST in .env}:${TIERING_SHARE_PLEX:?set TIERING_SHARE_PLEX in .env}:ro,rslave"
      - "${TIERING_STATE_DIR:?set TIERING_STATE_DIR in .env}:/state"

  # AltMount: the usenet-backed WebDAV store the offloaded bytes are read back from, plus
  # the SABnzbd-compatible import API. It shares the tiering container's network
  # namespace, so tiering reaches it at http://localhost:8480 (loopback: no https or
  # TIERING_ALTMOUNT_ALLOW_HTTP needed) and the web UI is at http://${TIERING_IP}:8480.
  # 8480 is free in that namespace (tierfs 9109, runner 8471; AltMount's peer listener
  # 8470 and internal rclone RC 5573 stay at their defaults).
  # No usenet provider yet: add them in the UI (Configuration > Providers).
  # Needs JWT_SECRET (ALTMOUNT_JWT_SECRET in .env): without it AltMount exits at start and
  # restarts in a loop, which does not affect the tiering service.
  # Because it joins tiering's namespace, recreating tiering (a new image or changed env)
  # leaves AltMount on a dead namespace: docker-compose up -d recreates it too, but if you
  # recreate tiering by hand, run: docker-compose up -d --force-recreate altmount
  # Deliberately left out vs upstream: docker.sock/auto-update, the /mnt mount, /dev/fuse
  # and SYS_ADMIN (only for its own rclone mount, off by default; we use WebDAV + API).
  altmount:
    image: ghcr.io/kipsilabs/altmount:v0.4.0   # upstream moved from ghcr.io/javi11 at v0.4.0
    container_name: altmount
    restart: unless-stopped
    network_mode: "service:tiering"
    depends_on:
      - tiering
    environment:
      PUID: "${ALTMOUNT_PUID:-99}"     # Unraid nobody:users
      PGID: "${ALTMOUNT_PGID:-100}"
      PORT: "8480"
      JWT_SECRET: "${ALTMOUNT_JWT_SECRET:-}"
      # Must match the address the web UI is opened at.
      COOKIE_DOMAIN: "${TIERING_IP:?set TIERING_IP in .env}"
    volumes:
      - "${ALTMOUNT_CONFIG_DIR:-/mnt/user/appdata/altmount}:/config"

  # The webhook container reads library files too (audits, duplicate cleanup), so
  # it needs the mount at the same path to follow the symlinks.
  arr-webhook:
    volumes:
      - "${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}:${TIERFS_MOUNT:?set TIERFS_MOUNT in .env}:ro,rslave"
